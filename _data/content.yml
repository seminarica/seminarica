services:
  - slug: supervision
    menu: Supervision
    heading: Gemeinsam auf die Arbeit schauen
    paragraphs:
      - 'Wandel ist immer. Veränderung fordert; manchmal überfordert sie. Gleichermaßen belastend für Institutionen und Teams kann eine Routine sein, die neue Ideen nicht angemessen würdigt und aufgreift. <br /> Das Aufeinandertreffen von Institution, Team und Professionalität ist komplex. In supervisorischer Beratung verständigen sich Teams. Über Auftrag, Anforderungen und gute Praxis. Über besseres Gelingen von Arbeit und Gesundheit. Systemisch strukturierte Kommunikation verbindet Information und Emotion. Das schafft Sicherheit. Wir nennen es Reflexion. <br /> <br /> Nie war sie nötiger: Reflexionsfähigkeit. So schreibt es der Dach- und Fachverband Deutsche Gesellschaft für Supervision.'
      - 'Feldkompetenzen: <ul> <li>Projektentwicklung/Organisationsentwicklung </li> <li> Kinder- und Jugendhilfe (ambulant und stationär) </li> <li> Schule </li> <li> Berufliche Integrationsförderung </li> <li> Ausbildung, generell Übergang Schule-Beruf </li> <li> Sozialpsychiatrie </li> <li> Suchthilfe </li> <li> Rechtliche Betreuung </li> <li> Arbeitszufriedenheit und Gesundheit (BGM) </li> </ul> Kenntnisse der jeweiligen Branche können hilfreich sein. Über grundlegende Themen schein Einvernehmen zu herrschen. Und dennoch: Manchmal ist es besonders hilfreich für neugierige Fragen und treffende Aussagen, völlig unbeleckt zu sein. Ein Höfling hätte nie gewagt zu sagen: „Der Kaiser hat ja gar nichts an!“ <br /> <br /> Schreiben Sie mich einfach an. Das Kennenlernen ist unverbindlich und gratis. Kontakt-Button mit E-Mailadresse holger-klemm@seminarica.de'
    quote: „Krise ist ein produktiver Zustand. Man muss ihm nur den Beigeschmack der Katastrophe nehmen.“ -Max Frisch
  - slug: ausbildung
    menu: Ausbildung
    heading: Motivieren – Lernen – Verhalten
    paragraphs:
      - Sie investieren in den Nachwuchs. Und Sie wünschen sich die besten. Aber es wird eng, die richtigen Auszubildenden zu finden. Ich unterstütze Sie bei der Auswahl mit einem auf Ihr Unternehmen zugeschnittenen Assessment. Für Ausbilder biete ich Infos und Training zum Umgang mit den aktuellen Herausforderungen. <br /> <br /> Seit 2000 arbeite ich mit Ausbildern. Viele von ihnen arbeiten bei beruflichen Bildungsträgern. In überbetrieblichen Ausbildungen, ausbildungsbegleitenden Hilfen und Berufsvorbereitung haben sie sich eingestellt auf besonders schwierige Auszubildende. Und sie leisten Großes. Das Know-how und die Praxiserfahrungen, junge Menschen zu motivieren, gebe ich in Ausbilderseminaren weiter. So auch bei der IHK Berlin.
      - Mein Angebot <br /> Ich berate, unterstütze und trainiere Sie <ul> <li> bei der Auswahl künftiger Azubis, </li> <li> bei Fragen zu Motivation und Ausbildungsabbruch- Prävention,</li><li> bei fachlicher Weiterbildung der Ausbilder, Bildungsbegleiter, Jobcoaches </li> <li>  AEVO-Prüfer im Prüfungsausschuss der IHK Berlin von 2013 bis 2020 </li> </ul>
    quote: Lernen braucht Raum für eigene Erfahrungen.
  - slug: beratung
    menu: Beratung
    heading: Der Blick von außen
    paragraphs:
      - Es geht um Arbeitszufriedenheit und Gesundheit. Im Auftrag der Senatsverwaltung für Bildung arbeite ich mit Schulleitungen, Kollegien und Kleinteams daran. <br /> Langfristige Prozessbegleitung klärt und unterstützt. Der Einzelne entdeckt ein breiteres Handlungsspektrum. Kollegien verständigen sich auf bessere Zusammenarbeit. Schulleitungen setzen neue Akzente in ihrer Arbeit. <br /> <br /> Darüber hinaus berate ich seit mehr als 20 Jahren Heranwachsende bei der Ausbildungs- und Berufswegeplanung, Familien sowie Menschen aller Couleur in privaten und beruflichen Veränderungen.
      - Mein Angebot <br /> <br /> Sprechen Sie mich an, wenn Sie eine bessere Work-Life-Balance für sich suchen.
    quote: Der Blick von außen kann den nächsten Schritt sichtbar machen.
  - slug: coaching
    menu: Coaching
    heading: Eigene Antworten finden
    paragraphs:
      - In jedem Menschen sind bereits alle nötigen Fähigkeiten angelegt - man muss sie nur freilegen und entwickeln. <br /> <br /> Als systemischer Coach setze ich auf die Selbstverantwortung. Sie entscheiden über die Themen und das Tempo. Sie sollen Ihre eigenen Lösungen finden, die wirklich zu Ihnen passen und tragfähig sind.
      - 'Mein Angebot <br />Ich coache Sie <ul> <li> wenn Sie private und berufliche Hürden nehmen möchten </li> <li> wenn Sie als Führungskraft vor neuen Herausforderungen stehen </li> <li> als Team in beruflichen Änderungsprozessen </li> <li> bei Fragen der Mitarbeiterzufriedenheit und Arbeitnehmerorientierung </li> <li> bevor Ihr Arzt sagt: „Ach wären Sie mal früher gekommen!“</li> </ul> Darunter: Kontakt-Button mit E-Mailadresse coaching@seminarica.de'
    quote: Gute Fragen führen zu eigenen Antworten.
    link: Kontakt aufnehmen
  - slug: seminare
    menu: Seminare
    heading: Wissen, das im Alltag weiterwirkt
    paragraphs:
      - Mein Themenspektrum <ul> <li> Organisationsentwicklung </li> <li> Nachwuchs-Führungskräftetraining </li> <li> Arbeitszufriedenheit und Gesundheit </li> <li> Teamentwicklung. IN und OUT door </li> <li> Humor als Resilienzmotor </li> <li> Lustvoller Umgang mit belastenden Situationen </li> <li> Hurra, wir träumen noch! – Schlafgesundheit </li> <li> Selber! EmPOWERment in Teams </li> <li> Streiten – Reden – Handeln. Konfliktbearbeitung praktisch </li> </ul>
      - Mein Angebot <br /> Was soll nach dem Seminar anders sein? <ul> <li> ausführliches Vorgespräch </li> <li> Themen-, Inhalts- und Zielvereinbarung </li> <li> umfangreiches Handout und Begleitmaterial </li> <li> bei Interesse Einsatz von Online- und Befragungstools </li> <li> Seminardokumentation in Wort und Bild </li> <li> Zertifikate für alle Teilnehmer </li> <li> Auswertung der Teilnehmerzufriedenheit </li> <li> Nachgespräch </li> </ul> 
    quote: Wissen wird lebendig, wenn man es ausprobiert.
    link: Seminar anfragen
  - slug: referenzen
    menu: Referenzen
    heading: Zusammenarbeit, die Vertrauen schafft
    paragraphs:
      - 'Seminare, Graduierungskurse, Workshops, Praxisbegleitung, Coaching und Projektberatung bei:'
      - Referenzen und Zitate lassen sich einfach in diesem Abschnitt ergänzen.
    quote: Zusammenarbeit beginnt mit Vertrauen.
person:
  heading: Holger Klemm
  paragraphs:
    - Ich begleite Menschen und Organisationen in Entwicklungs- und Veränderungsprozessen. Wichtig sind mir eine klare Haltung, ein wertschätzender Blick und Lösungen, die im Alltag wirklich funktionieren.
    - Hier ist Platz für Werdegang, Qualifikationen und Schwerpunkte.

